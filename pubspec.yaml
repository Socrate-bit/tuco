name: tuco
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

  ## TEST
  mocktail: ^1.0.5
  bloc_test: ^10.0.0

  ## AUTH
  firebase_auth: ^6.3.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0

  ## LOCALIZATION
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  ## STORAGE
  firebase_core: ^4.6.0
  cloud_firestore: ^6.2.0
  shared_preferences: ^2.3.3

  ## SUBSCRIPTION + ANALYTICS
  superwallkit_flutter: ^2.4.11
  mixpanel_flutter: ^2.9.0
  mixpanel_flutter_session_replay: ^1.1.1

  ## UI / UX
  flutter_screenutil: ^5.9.3
  connectivity_plus: ^7.0.0
  uuid: ^4.5.1
  crypto: ^3.0.7
  confetti: ^0.8.0
  url_launcher: ^6.3.1
  in_app_review: ^2.0.11
  time_picker_spinner: ^1.0.2
  signature: ^6.3.0

  ## FEATURES
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.6 # App Check token required by Firebase AI Logic
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.2
  cloud_functions: ^6.1.0
  audioplayers: ^6.1.0
  record: ^6.2.1 # mic capture (WAV/PCM) for Azure pronunciation assessment
  http: ^1.6.0 # direct REST calls to Azure Speech (dev only)
  firebase_storage: ^13.0.0 # store voice recordings for listen-back
  google_fonts: ^8.2.1
  liquid_glass_widgets: ^0.30.2
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/onboarding/
    - assets/images/
    - assets/images/game/
    - assets/images/game/shop_tab/
    - assets/images/streak_badges/
    - assets/songs/

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/app_icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo.png
  android: false
  ios: true
